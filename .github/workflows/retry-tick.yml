name: Retry tick

# Drives the recovery agent's delayed retries.
#
# Why this exists: cases the policy engine parks as RETRY_PENDING come due in
# about thirty minutes (see `delayMinutes ?? 30` in recoveryPipeline.ts). Vercel's
# Hobby plan only allows a once-daily cron, which would leave those cases waiting
# up to a day. This workflow calls the same authenticated endpoint every five
# minutes instead, which is free and more precise than Hobby cron's +/-59 minute
# window.
#
# It does nothing until you add two repository secrets
# (Settings -> Secrets and variables -> Actions):
#
#   RETRY_TICK_URL     https://<backend>.vercel.app/api/cron/retry-tick
#   CRON_SECRET        the same value set in the backend's Vercel env vars
#
# Without them each run exits successfully with a notice, so an unconfigured fork
# does not fill your inbox with failures. To turn it off entirely, disable the
# workflow under the Actions tab or delete this file — the Vercel cron in
# backend/vercel.json keeps running as a daily backstop either way.
#
# Two caveats worth knowing: GitHub queues scheduled workflows and can run them
# several minutes late or skip them under load, and it disables schedules in a
# public repository after 60 days without a commit.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: retry-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the retry tick
        env:
          RETRY_TICK_URL: ${{ secrets.RETRY_TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RETRY_TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::RETRY_TICK_URL or CRON_SECRET is not set — skipping."
            exit 0
          fi

          status=$(curl --silent --show-error --fail-with-body \
            --max-time 60 --retry 2 --retry-delay 5 \
            --output response.json --write-out '%{http_code}' \
            --request POST "$RETRY_TICK_URL" \
            --header "Authorization: Bearer $CRON_SECRET") || true

          echo "HTTP $status"
          # The endpoint returns { ok, processed, ranAt } and never echoes secrets.
          cat response.json 2>/dev/null || true
          echo

          case "$status" in
            200) ;;
            401) echo "::error::Rejected. CRON_SECRET here does not match the backend's."; exit 1 ;;
            503) echo "::error::Scheduled retries are disabled — set CRON_SECRET on the backend."; exit 1 ;;
            *)   echo "::error::Unexpected response ($status)."; exit 1 ;;
          esac
